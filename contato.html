<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contato · Trindade Santa</title>
  <meta name="theme-color" content="#0b4ea2">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@1,9..144,500..700&family=Marcellus&family=Marcellus+SC&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
  <div data-cabecalho="transparente"></div>

  <main id="conteudo">
    <section class="topo-foto topo-foto--meio">
      <div class="topo-foto__img"><img src="assets/img/fotos/assembleia/18.jpg" alt="Mulheres sentadas ouvindo a pregação" fetchpriority="high"></div>
      <div class="container">
        <nav class="migalhas" aria-label="Você está em"><a href="index.html">Início</a><span aria-hidden="true">/</span><span>Contato</span></nav>
        <div class="topo-foto__linha">
          <h1 data-palavras>Contato</h1>
          <div></div>
        </div>
      </div>
    </section>

    <section class="bloco bloco--papel">
      <div class="container par" style="align-items:start">
        <div>
          <h2 data-palavras>Fale com a gente</h2>
          <ul class="canais revelar">
            <li><a data-link="instagram" target="_blank" rel="noopener"><strong>Instagram</strong><span>@ctrindadesanta</span></a></li>
            <li><a data-link="youtube" target="_blank" rel="noopener"><strong>YouTube</strong><span>Comunidade Trindade Santa</span></a></li>
            <li><a data-link="canalWhatsapp" target="_blank" rel="noopener"><strong>Canal do WhatsApp</strong><span>Avisos da comunidade</span></a></li>
            <li><a data-link="missoesWhatsapp" target="_blank" rel="noopener"><strong>Missões</strong><span>Leve a comunidade ao seu evento</span></a></li>
            <li><a data-link="lojaWhatsapp" target="_blank" rel="noopener"><strong>Loja</strong><span>Loja Trindade Santa</span></a></li>
          </ul>
        </div>
        <form class="form revelar" onsubmit="event.preventDefault()">
          <div class="linha2">
            <div class="campo"><label for="c-nome">Nome</label><input id="c-nome" type="text" autocomplete="name"></div>
            <div class="campo"><label for="c-email">E-mail</label><input id="c-email" type="email" autocomplete="email"></div>
          </div>
          <div class="campo"><label for="c-assunto">Assunto</label><select id="c-assunto"><option>Informações</option><option>Pedido de oração</option><option>Eventos</option><option>Outro</option></select></div>
          <div class="campo"><label for="c-msg">Mensagem</label><textarea id="c-msg"></textarea></div>
          <p class="aviso">Formulário ainda sem envio configurado.</p>
          <div><button class="btn btn--primario" type="submit">Enviar mensagem <span data-icone="seta"></span></button></div>
        </form>
      </div>
    </section>  </main>

  <div data-rodape></div>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/marca.js"></script>
  <script>document.querySelectorAll('[data-link]').forEach(a => a.href = LINKS[a.dataset.link]);</script>
  <script src="assets/js/movimento.js"></script>
</body>
</html>
