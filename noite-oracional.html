<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noite Oracional Quem Como Deus · Trindade Santa</title>
  <meta name="description" content="Noite Oracional Quem Como Deus: uma noite inteira de oração com os arcanjos Miguel, Gabriel e Rafael.">
  <meta name="theme-color" content="#120406">
  <link rel="canonical" href="https://diasadm8.github.io/trindade-santa/noite-oracional">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Comunidade de Aliança Trindade Santa">
  <meta property="og:title" content="Noite Oracional Quem Como Deus · Trindade Santa">
  <meta property="og:description" content="Noite Oracional Quem Como Deus: uma noite inteira de oração com os arcanjos Miguel, Gabriel e Rafael.">
  <meta property="og:url" content="https://diasadm8.github.io/trindade-santa/noite-oracional">
  <meta property="og:image" content="https://diasadm8.github.io/trindade-santa/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@1,9..144,500..700&family=Marcellus&family=Marcellus+SC&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/tema.js"></script>
</head>
<body class="pagina-evento pagina-noite">
  <div data-cabecalho="transparente"></div>

  <main id="conteudo">
    <!-- ABERTURA -->
    <section class="noite-topo">
      <div class="noite-topo__img"><img src="assets/img/fotos/noite2025/04.jpg" alt="Dois missionários rezando no palco, um com a Bíblia nas mãos" fetchpriority="high" width="1280" height="1920"></div>
      <div class="container noite-topo__conteudo">
        <nav class="migalhas" aria-label="Você está em"><a href="./">Início</a><span aria-hidden="true">/</span><a href="eventos">Eventos</a><span aria-hidden="true">/</span><span>Noite Oracional</span></nav>
        <img class="noite-topo__logo" src="assets/eventos/noite-oracional.png" alt="Quem Como Deus?" width="720" height="630">
        <h1 class="noite-topo__titulo">Noite Oracional</h1>
      </div>
    </section>

    <!-- SOBRE -->
    <section class="bloco noite-sobre">
      <div class="container par">
        <div>
          <h2 data-palavras>Uma noite inteira de <em>oração</em></h2>
          <div class="texto-corrido revelar" data-noite-sobre></div>
        </div>
        <div class="dupla">
          <div class="abre-foto"><img src="assets/img/fotos/noite2025/10.jpg" alt="Missionária pregando de braço erguido" loading="lazy" width="1280" height="1920"></div>
          <div class="abre-foto" style="transition-delay:.2s"><img src="assets/img/fotos/noite2025/16.jpg" alt="Cantor de braços abertos no louvor" loading="lazy" width="1920" height="1280"></div>
        </div>
      </div>
    </section>

    <!-- OS TRÊS ARCANJOS -->
    <section class="qcd-arcanjos" aria-labelledby="t-qcd-arcanjos">
      <h2 class="visually-hidden" id="t-qcd-arcanjos">Os três arcanjos</h2>
      <div class="qcd-arcanjo">
        <img src="assets/img/fotos/noite2025/01.jpg" alt="" loading="lazy" width="1280" height="1920">
        <div class="container qcd-arcanjo__linha"><span class="qcd-arcanjo__nome">Miguel</span><span class="qcd-arcanjo__sentido">“Quem como Deus?”</span></div>
      </div>
      <div class="qcd-arcanjo">
        <img src="assets/img/fotos/noite2025/05.jpg" alt="" loading="lazy" width="1280" height="1920">
        <div class="container qcd-arcanjo__linha"><span class="qcd-arcanjo__nome">Gabriel</span><span class="qcd-arcanjo__sentido">“Força de Deus”</span></div>
      </div>
      <div class="qcd-arcanjo">
        <img src="assets/img/fotos/noite2025/17.jpg" alt="" loading="lazy" width="1280" height="1920">
        <div class="container qcd-arcanjo__linha"><span class="qcd-arcanjo__nome">Rafael</span><span class="qcd-arcanjo__sentido">“Deus cura”</span></div>
      </div>
    </section>

    <!-- FOTOS 2025: fita que se arrasta -->
    <section class="bloco noite-fotos">
      <div class="container">
        <h2 data-palavras>Noite Oracional 2025</h2>
      </div>
      <div class="fita" data-fita tabindex="0" aria-label="Fotos da Noite Oracional 2025 (arraste para o lado)">
        <img src="assets/img/fotos/noite2025/07.jpg" alt="Missionária pregando" loading="lazy" width="1280" height="1920">
        <img src="assets/img/fotos/oracao/19.jpg" alt="Jovem de mãos erguidas em oração" loading="lazy" width="1920" height="1280">
        <img src="assets/img/fotos/noite2025/12.jpg" alt="Violonista no louvor" loading="lazy" width="1280" height="1920">
        <img src="assets/img/fotos/assembleia/24.jpg" alt="Mulheres rezando com uma criança" loading="lazy" width="1280" height="1920">
        <img src="assets/img/fotos/noite2025/02.jpg" alt="Pregador ao microfone" loading="lazy" width="1280" height="1920">
        <img src="assets/img/fotos/oracao/15.jpg" alt="Mãos erguidas com terço" loading="lazy" width="1920" height="1280">
        <img src="assets/img/fotos/louvor/22.jpg" alt="Pregador de braço estendido" loading="lazy" width="1280" height="1920">
        <img src="assets/img/fotos/assembleia/22.jpg" alt="Assembleia diante do palco iluminado de vermelho" loading="lazy" width="1920" height="1280">
        <img src="assets/img/fotos/noite2025/15.jpg" alt="Cantor de braços abertos" loading="lazy" width="1280" height="1920">
        <img src="assets/img/fotos/oracao/16.jpg" alt="Missionária com o microfone diante da luz" loading="lazy" width="1280" height="1920">
      </div>
    </section>

    <!-- FECHAMENTO -->
    <section class="chamada-foto noite-final">
      <img data-paralaxe="7" src="assets/img/fotos/assembleia/20.jpg" alt="Assembleia sentada ouvindo a pregação" loading="lazy" width="1920" height="1280">
      <div class="container">
        <h2 data-palavras>Quem como Deus?</h2>
        <p class="revelar">Acompanhe as próximas datas no Instagram da comunidade.</p>
        <a class="btn btn--noite revelar" data-link="instagram" target="_blank" rel="noopener">Acompanhe no Instagram <span data-icone="seta"></span></a>
      </div>
    </section>
  </main>

  <div data-rodape></div>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/marca.js"></script>
  <script>
    (function () {
      const ev = EVENTOS_ESPECIAIS['noite-oracional'];
      document.querySelector('[data-noite-sobre]').innerHTML = ev.sobre.map(p => `<p>${p}</p>`).join('');
      document.querySelectorAll('[data-link]').forEach(a => a.href = LINKS[a.dataset.link]);
      preencherMarcadores(); ativarRevelar();
    })();
  </script>
  <script src="assets/js/movimento.js"></script>
</body>
</html>
