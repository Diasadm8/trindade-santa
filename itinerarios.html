<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Itinerários Espirituais · Trindade Santa</title>
  <meta name="theme-color" content="#0b4ea2">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Marcellus+SC&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="pagina-imersiva">
  <div data-cabecalho="transparente"></div>

  <!-- Camadas que se transformam conforme o mês -->
  <div class="tema-fundo" aria-hidden="true"></div>
  <div class="tema-padrao" aria-hidden="true"></div>
  <div class="motivos" aria-hidden="true"></div>

  <main id="conteudo">
    <!-- Abertura -->
    <section class="itin-abertura">
      <div class="container">
        <span data-selo="espirito" class="itin-abertura__selo"></span>
        <span class="sobretitulo sobretitulo--claro">Formação espiritual</span>
        <h1>Itinerários Espirituais</h1>
        <p class="itin-abertura__ano" data-ano-atual></p>
        <div class="ph-lines" data-ph="2"></div>
        <a href="#linha" class="itin-abertura__rolar"><span>Role para percorrer o ano</span><i></i></a>
      </div>
    </section>

    <!-- Linha do tempo -->
    <section class="itin-linha" id="linha" aria-label="Linha do tempo dos itinerários">
      <div class="itin-linha__trilho" aria-hidden="true"><i></i></div>
      <div data-itinerarios></div>
    </section>

    <!-- Fechamento -->
    <section class="itin-fim">
      <div class="container">
        <span data-trio class="selo--branco"></span>
        <h2>O próximo itinerário chega em breve</h2>
        <div class="ph-lines" data-ph="2"></div>
        <a href="#linha" class="btn btn--claro">Voltar ao início do ano</a>
      </div>
    </section>
  </main>

  <!-- Navegação lateral pelos meses -->
  <nav class="itin-meses" aria-label="Ir para o mês" data-meses></nav>

  <div data-rodape></div>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/marca.js"></script>
  <script src="assets/js/itinerarios.js"></script>
</body>
</html>
