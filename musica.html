<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Música · Trindade Santa</title>
  <meta name="description" content="Música da Comunidade Trindade Santa: ouça nas plataformas, assista aos vídeos e leve o ministério para a sua missão.">
  <meta name="theme-color" content="#0b4ea2">
  <link rel="canonical" href="https://diasadm8.github.io/trindade-santa/musica">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:site_name" content="Comunidade de Aliança Trindade Santa">
  <meta property="og:title" content="Música · Trindade Santa">
  <meta property="og:description" content="Música da Comunidade Trindade Santa: ouça nas plataformas, assista aos vídeos e leve o ministério para a sua missão.">
  <meta property="og:url" content="https://diasadm8.github.io/trindade-santa/musica">
  <meta property="og:image" content="https://diasadm8.github.io/trindade-santa/assets/img/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,opsz,wght@1,9..144,500..700&family=Marcellus&family=Marcellus+SC&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/site.css">
  <script src="assets/js/tema.js"></script>
</head>
<body>
  <div data-cabecalho="transparente"></div>

  <main id="conteudo">
    <section class="topo-foto topo-foto--meio">
      <div class="topo-foto__img"><img src="assets/img/fotos/louvor/24.jpg" alt="Cantor ao microfone" fetchpriority="high"></div>
      <div class="container">
        <nav class="migalhas" aria-label="Você está em"><a href="./">Início</a><span aria-hidden="true">/</span><span>Música</span></nav>
        <div class="topo-foto__linha">
          <h1 data-palavras>Música</h1>
          <div></div>
        </div>
      </div>
    </section>

    <!-- Último lançamento -->
    <section class="bloco bloco--papel">
      <div class="container par">
        <a class="single revelar" data-link="spotifySingle" target="_blank" rel="noopener" aria-label="Ouvir Ser Trindade Santa no Spotify">
          <img src="assets/img/musica/ser-trindade-santa.jpg" alt="Capa do single Ser Trindade Santa" width="640" height="640" loading="lazy">
        </a>
        <div>
          <p class="mes-faixa__mes revelar">Último lançamento</p>
          <h2 data-palavras>Ser Trindade Santa</h2>
          <div class="mes-faixa__acoes revelar">
            <a class="btn btn--primario" data-link="spotifySingle" target="_blank" rel="noopener">Ouvir no Spotify <span data-icone="seta"></span></a>
            <a class="btn btn--contorno" data-link="ouvir" target="_blank" rel="noopener">Outras plataformas</a>
          </div>
          <p class="revelar" style="margin-top:22px"><a class="link-mais" data-link="spotifyArtista" target="_blank" rel="noopener">Perfil da comunidade no Spotify <span data-icone="seta"></span></a></p>
        </div>
      </div>
    </section>

    <!-- Vídeos do YouTube -->
    <section class="bloco bloco--noite videos">
      <div class="container">
        <h2 data-palavras>Assista</h2>
      </div>
      <div class="fita fita--videos" data-fita data-videos tabindex="0" aria-label="Vídeos de música no YouTube (arraste para o lado)"></div>
      <div class="container"><p class="revelar" style="margin-top:10px"><a class="link-mais" data-link="youtube" target="_blank" rel="noopener" style="color:var(--ts-amarelo)">Canal no YouTube <span data-icone="seta"></span></a></p></div>
    </section>

    <!-- Missionários da música -->
    <section class="bloco">
      <div class="container">
        <h2 data-palavras>Leve para a sua <em>missão</em></h2>
        <div class="baluartes-linhas" data-artistas></div>
      </div>
    </section>  </main>

  <div data-rodape></div>
  <script src="assets/js/dados.js"></script>
  <script src="assets/js/marca.js"></script>
  <script>
    (function () {
      const VIDEOS = [
        ['OWi5URKH-1E', 'Plantados para Multiplicar (Acústico)'],
        ['oxqnYUhVCzE', 'Atos 2 (Acústico)'],
        ['CApbCsndOw0', 'Ser Trindade Santa · Ao vivo no SETA 2025'],
        ['TXoB8f9ucXo', 'Quem Como Deus · Clipe oficial'],
        ['zwCvDrEphGs', 'Salmo 1 · Clipe oficial']
      ];
      document.querySelector('[data-videos]').innerHTML = VIDEOS.map(([id, t]) => `
        <a class="video" href="https://www.youtube.com/watch?v=${id}" target="_blank" rel="noopener">
          <span class="video__img"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy"><span class="video__play" aria-hidden="true"></span></span>
          <strong>${t}</strong>
        </a>`).join('');
      document.querySelector('[data-artistas]').innerHTML = MUSICA.artistas.map((a, k) => `
        <article class="baluarte-linha${k % 2 ? ' baluarte-linha--inv' : ''}">
          <div class="baluarte-linha__foto abre-foto">${a.foto ? `<img src="assets/img/musica/${a.foto}" alt="${a.nome}" loading="lazy">` : `<span class="baluarte-linha__selo">${selo(a.simbolo, 'selo--branco')}</span>`}</div>
          <div class="baluarte-linha__texto revelar">
            <h3>${a.nome}</h3>
            <p class="baluarte-linha__frase">${a.papel} · Trindade Santa</p>
            <a class="btn btn--primario" href="${a.whatsapp}" target="_blank" rel="noopener">Chamar no WhatsApp <span data-icone="seta"></span></a>
          </div>
        </article>`).join('');
      document.querySelectorAll('[data-link]').forEach(a => a.href = LINKS[a.dataset.link]);
      preencherMarcadores();
      ativarRevelar();
    })();
  </script>
  <script src="assets/js/movimento.js"></script>
</body>
</html>
